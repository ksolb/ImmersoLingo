name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build project
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          skipActivation: true
          
