name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compile project
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\6000.3.18f1\Editor\Unity.exe" -batchmode -nographics -quit -projectPath "%GITHUB_WORKSPACE%" -logFile "%GITHUB_WORKSPACE%\unity_build.log"
          type "%GITHUB_WORKSPACE%\unity_build.log"

      - name: Fail on compile errors
        shell: pwsh
        run: |
          $log = Get-Content "$env:GITHUB_WORKSPACE\unity_build.log" -Raw
          if ($log -match "error CS\d+") {
            Write-Host "Compile errors found:"
            Select-String -Path "$env:GITHUB_WORKSPACE\unity_build.log" -Pattern "error CS\d+"
            exit 1
          } else {
            Write-Host "No compile errors found."
          }
